{{ block "index" .}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="/static/scripts/htmx.min.js"></script>
        <link rel="stylesheet" href="/static/style/output.css" />
        <title>Dashboard</title>
    </head>
    <body class="bg-[#242424] font-mono">
        <nav
            class="fixed top-0 z-20 flex w-full bg-[#242424] outline outline-1 outline-[#F0EAD6]/50 text-[#F0EAD6] p-4 justify-between items-center text-sm"
        >
            <p>Dashboard</p>
            {{ if .IsNotionConnected }}
                {{ template "notion-logout-button" . }}
            {{ else }}
                {{ template "notion-login-button" . }}
            {{ end }}
        </nav>
        <div class="mt-20 grid grid-cols-5 grid-flow-row gap-4 p-3 w-full h-full z-10 overflow-hidden">
            {{ range  .NotionConns }}
                {{ template "connection-widget" . }}
            {{ end }}
        </div>
    </body>
    <script src="static/scripts/dashboard.js"></script>
</html>
{{ end }}
